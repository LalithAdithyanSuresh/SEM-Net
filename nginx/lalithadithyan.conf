server {
    if ($host = lalithadithyan.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name lalithadithyan.dev;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lalithadithyan.dev;

    ssl_certificate     /etc/letsencrypt/live/lalithadithyan.dev-0001/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lalithadithyan.dev-0001/privkey.pem;   # managed by Certbot

    # Allow large model checkpoint uploads
    client_max_body_size 0;

    # ── Main app → Flask C2 server (port 5000) ─────────────────────────────
    location / {
        proxy_pass         http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_cache_bypass $http_upgrade;

        # Real-time log streaming
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── Setup Status Dashboard → Flask (port 5000) ─────────────────────────
    # NOTE: This MUST appear before "location /dashboard" below.
    # Nginx longest-prefix-match means /dashboard/status beats /dashboard.
    location /dashboard/status {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── Setup Status API → Flask (port 5000) ───────────────────────────────
    location /api/setup_status {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # ── Terminal dashboard → port 1254 ─────────────────────────────────────
    location /dashboard {
        proxy_pass         http://127.0.0.1:1254;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "Upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # No buffering — raw interactive terminal stream
        proxy_buffering    off;

        # 24h timeout so the terminal stays open when you step away
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 75s;
    }

    # ── Training images served directly ────────────────────────────────────
    location /images/ {
        alias /path/to/your/project/c2_server/static/images/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Agent status file ──────────────────────────────────────────────────
    location = /agent.txt {
        alias        /home/cloudai578/terminal/agent.txt;
        default_type text/plain;
        allow        all;
    }
}
