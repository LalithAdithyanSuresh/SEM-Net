# ──────────────────────────────────────────────────────────────────────────────
# Nginx config for lalithadithyan.dev
# Place this in: /etc/nginx/sites-available/lalithadithyan.dev
# ──────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name lalithadithyan.dev www.lalithadithyan.dev;
    return 301 https://$host$request_uri;
}

# Main HTTPS server — proxies to Flask C2 server on port 5000
server {
    listen 443 ssl http2;
    server_name lalithadithyan.dev www.lalithadithyan.dev;

    # ── SSL Certificates (Let's Encrypt / Certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/lalithadithyan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lalithadithyan.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # ── Dashboard: /dashboard/status → Flask serves setup_dashboard.html ───
    # No special routing needed — Flask handles /dashboard/status directly.
    # Just make sure the proxy_pass below covers all paths.

    # ── API: allow large uploads (model checkpoints) ────────────────────────
    client_max_body_size 0;   # unlimited — chunked uploads handle size

    # ── Proxy everything to Flask C2 server ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;   # keep alive for long training log streams
        proxy_send_timeout 3600s;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# files.lalithadithyan.dev — proxies to FastAPI file server on port 8000
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name files.lalithadithyan.dev;

    ssl_certificate     /etc/letsencrypt/live/files.lalithadithyan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.lalithadithyan.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # No upload size limit — large model checkpoints come through here
    client_max_body_size 0;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;   # stream large uploads directly
    }

    server {
        listen 80;
        server_name files.lalithadithyan.dev;
        return 301 https://$host$request_uri;
    }
}
